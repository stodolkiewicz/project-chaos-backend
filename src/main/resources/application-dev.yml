spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/project-chaos}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}

  jpa:
    show-sql: false

  ai:
    chat:
      # ChatModel layer. Writes the prompt and the completion of each model call to the application log.
      # Does not affect Input and Output in Langfuse. They come from ChatModelCompletionContentObservationFilter.
      observations:
        log-prompt: false
        log-completion: false
      client:
        # ChatClient layer. Writes the prompt and the completion of each ChatClient call to the application log.
        observations:
          log-prompt: false
          log-completion: false

  cloud:
    gcp:
      sql:
        enabled: false
      core:
        enabled: false

  liquibase:
    contexts: dev
    drop-first: true

  kafka:
    producer:
      bootstrap-servers: localhost:9092
      properties:
        schema.registry.url: http://localhost:8081

management:
  otlp:
    metrics:
      export:
        # goes to Prometheus (locally) or GCP sidecar collector
        url: http://localhost:4318/v1/metrics
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          # goes to Tempo (locally) or GCP sidecar collector
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          # goes to Loki (locally) or GCP sidecar collector
          endpoint: http://localhost:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    org.springframework.boot.actuator.autoconfigure.opentelemetry: DEBUG
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    sun.rmi: INFO
    javax.management.remote.rmi: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

app:
  langfuse:
    base-url: https://cloud.langfuse.com
    auth: ${LANGFUSE_AUTH:}
    system-prompt:
      name: system-prompt
      label: production
      cache-ttl-seconds: 60
  frontend-dashboard-url: http://localhost:3000/dashboard
  security:
    cookie:
      domain: localhost
      secure: false
  ai:
    number-of-requests-in-time-window-limit: 50
    time-window-in-minutes: 10
